name: Build OrbbecSDK Deb Package

on:
  push:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: [self-hosted, Linux, ARM64, "24.04"]
    runs-on: ${{ matrix.os }}
    env:
      MATRIX_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Version check (CMake vs changelog)
        run: |
          CMAKE_VERSION=$(grep -oP 'project\([^)]*VERSION\s+\K[0-9.]+' CMakeLists.txt | head -n 1)
          CHANGELOG_VERSION=$(head -1 debian/changelog | grep -oP '\((.*?)\)' | tr -d '()' | cut -d'-' -f1)

          echo "CMake version:     $CMAKE_VERSION"
          echo "changelog version: $CHANGELOG_VERSION"

          if [ "$CMAKE_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::Version mismatch! CMake=$CMAKE_VERSION, changelog=$CHANGELOG_VERSION"
            exit 1
          fi

          echo "✅ Version check passed: $CMAKE_VERSION"

      - name: Tag vs changelog version check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CHANGELOG_VERSION=$(head -1 debian/changelog | grep -oP '\((.*?)\)' | tr -d '()' | cut -d'-' -f1)

          echo "Tag version:       $TAG_VERSION"
          echo "Changelog version: $CHANGELOG_VERSION"

          if [ "$TAG_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::Version mismatch! tag=v$TAG_VERSION, changelog=$CHANGELOG_VERSION"
            exit 1
          fi

          echo "✅ Tag matches changelog: v$TAG_VERSION"

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ dpkg-dev debhelper devscripts patchelf pkg-config

      - name: Build deb package
        run: |
          dpkg-buildpackage -us -uc -b
          VERSION=$(dpkg-parsechangelog -S Version)
          mv "../orbbecsdk_${VERSION}_${MATRIX_ARCH}.deb" .
          echo "PKG_VERSION=${VERSION%%-*}" >> $GITHUB_ENV
          ls -l orbbecsdk_*.deb

      - name: Verify package
        run: |
          DEB=$(ls orbbecsdk_*.deb)
          dpkg-deb -f "$DEB" Package Version Architecture Depends
          dpkg-deb -c "$DEB" | grep -Fq 'usr/lib/libOrbbecSDK.so.2'
          dpkg-deb -c "$DEB" | grep -Fq 'usr/include/libobsensor'
          dpkg-deb -c "$DEB" | grep -Fq 'usr/bin/ob_device_firmware_update'
          dpkg-deb -c "$DEB" | grep -Fq 'lib/udev/rules.d/99-obsensor-libusb.rules'
          dpkg-deb --fsys-tarfile "$DEB" | tar -xO ./usr/bin/ob_device_firmware_update > /tmp/obfw
          readelf -d /tmp/obfw | grep -Fq '$ORIGIN/../lib'
          dpkg-deb --fsys-tarfile "$DEB" | tar -xO ./lib/udev/rules.d/99-obsensor-libusb.rules | grep -Fq 'MODE:="0660"'

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbbecsdk-v${{ env.PKG_VERSION }}-${{ matrix.arch }}
          path: orbbecsdk_*.deb

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: orbbecsdk_*.deb
